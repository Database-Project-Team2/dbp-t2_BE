spring:
  application:
    name: dbp-t2-server
  config:
    import: optional:file:.env[.properties]

  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul
    deserialization:
      # 명세에 없는 필드(system_role, employee_no 등)는 400으로 거부한다.
      fail-on-unknown-properties: true
      # 점수 3.5 같은 소수를 정수로 잘라 받지 않는다.
      accept-float-as-int: false
    default-property-inclusion: always

  mvc:
    format:
      date: iso

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:employee_project_management}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:dbp}
    password: ${DB_PASSWORD:dbp1234}

  jpa:
    open-in-view: false
    hibernate:
      # 스키마의 기준은 db/init/01_schema.sql. JPA는 매핑이 스키마와 맞는지 검사만 한다.
      ddl-auto: validate
      naming:
        # 기본 전략은 테이블명을 소문자로 바꿔 리눅스 MySQL에서 EMPLOYEE ≠ employee 오류가 난다.
        # @Table/@Column에 적은 이름을 그대로 쓰도록 고정한다.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

server:
  # 배포 서버는 Caddy가 /dbp-api 접두사를 떼고 넘기며 X-Forwarded-Prefix를 붙인다. Swagger 주소 계산에 반영한다.
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: https://dbp-t2-fe.vercel.app,http://localhost:5173
  resident-no-key: ${RESIDENT_NO_KEY}
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: 12

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
